<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART KDAT — Keseluruhan Data</title><style>
:root{--n:#0B2545;--b:#2F63AF;--s:#22CBF2;--p:#EC3D7C;--bg:#EEF4F9;--bd:#D7E3EE}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--n)}header{height:76px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand img{width:110px;max-height:58px;object-fit:contain}.nav a{text-decoration:none;color:var(--n);font-weight:bold;font-size:12px;padding:10px;border-radius:10px}.nav .active{background:var(--n);color:#fff}.wrap{max-width:1500px;margin:auto;padding:24px 5%}.hero{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;border-radius:22px;padding:26px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#DCEBFA}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.chip{padding:10px 14px;background:#ffffff18;border:1px solid #ffffff28;border-radius:12px}.controls{display:grid;grid-template-columns:1.4fr repeat(3,1fr) auto;gap:10px;margin:16px 0}.controls input,.controls select,.controls button{height:44px;border-radius:11px;padding:0 12px;font:inherit;font-size:12px}.controls input,.controls select{border:1px solid var(--bd);background:#fff}.controls button{border:0;background:var(--n);color:#fff;font-weight:bold;cursor:pointer}.actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}.actions button{padding:10px 14px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-weight:bold;cursor:pointer}.actions .csv{color:#187338}.actions .pdf{color:#B51D58}.grid{display:grid;grid-template-columns:270px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px}.card h3{margin:0 0 8px}.tabs button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-weight:bold;cursor:pointer}.tabs button.active{background:var(--n);color:#fff}.bar{display:grid;grid-template-columns:90px 1fr 35px;gap:7px;align-items:center;font-size:11px;margin:10px 0}.track{height:9px;background:#EAF1F8;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--b),var(--s));border-radius:9px}.tablewrap{overflow:auto;max-height:620px;border:1px solid var(--bd);border-radius:12px}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:11px}th{position:sticky;top:0;background:var(--n);color:#fff;padding:10px;text-align:left;white-space:nowrap}td{padding:9px;border-bottom:1px solid #EEF2F6;max-width:260px;word-break:break-word}tr:nth-child(even){background:#FAFCFE}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px}.pager button{padding:8px 11px;border:1px solid var(--bd);background:#fff;border-radius:8px;font-weight:bold;cursor:pointer}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:600px){.controls{grid-template-columns:1fr}.wrap{padding:16px}.brand img{width:80px}.nav a{font-size:10px;padding:7px}}
</style></head><body>
<header><div class="brand"><img src="kempen-internet-selamat-logo.png"><b>SMART KDAT — Keseluruhan Data</b></div><nav class="nav"><a href="index.html">AI Assistant</a><a href="dashboard.html">Dashboard</a><a class="active" href="data-explorer.html">Keseluruhan Data</a></nav></header>
<main class="wrap"><section class="hero"><h1>Interactive Data Explorer</h1><p>Cari dan tapis keseluruhan data daripada semua kolum Program dan Institusi Pendidikan.</p><div class="stats"><div class="chip"><b id="total">—</b> Rekod</div><div class="chip"><b id="prog">—</b> Program</div><div class="chip"><b id="inst">—</b> Institusi</div></div></section>
<section class="controls"><input id="q" placeholder="Cari nama, lokasi, perasmi, modul, kategori atau apa sahaja..."><select id="ds"><option value="all">Semua Dataset</option><option value="program">Program</option><option value="institusi">Institusi</option></select><select id="st"><option value="">Semua Negeri</option></select><select id="yr"><option value="">Semua Tahun</option></select><button id="reset">Reset</button></section>
<div class="grid"><aside><div class="card"><h3>Dataset</h3><div class="tabs"><button data-m="all" class="active">🌐 Semua Data</button><button data-m="program">📌 Program</button><button data-m="institusi">🏫 Institusi Pendidikan</button></div></div><div class="card"><h3>Top Negeri</h3><div id="bars"></div></div></aside>
<section><div class="actions"><button class="csv" id="csv">⬇ Download CSV</button><button class="pdf" id="pdf">⬇ Download PDF</button></div><div class="card" style="padding:0"><div id="note" style="padding:14px;font-size:12px;color:#66778A"></div><div class="tablewrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="pager"><span id="pageinfo"></span><div><button id="prev">← Sebelum</button> <button id="next">Seterusnya →</button></div></div></div></section></div></main>
<script>
const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=(r,n)=>{for(const x of n){const k=Object.keys(r||{}).find(z=>z.trim().toLowerCase()===x.toLowerCase());if(k&&r[k]!==''&&r[k]!=null)return String(r[k]).trim()}return ''};
let P=[],I=[],pg=1;const size=40;
Promise.all([fetch('program.json').then(r=>r.json()),fetch('institusi.json').then(r=>r.json())]).then(([p,i])=>{P=Array.isArray(p)?p:[];I=Array.isArray(i)?i:[];setup();render()}).catch(e=>{$('#note').textContent='Gagal memuatkan data JSON.'});
function setup(){const a=P.concat(I),states=[...new Set(a.map(r=>pick(r,['Negeri','NEGERI'])).filter(Boolean))].sort(),years=[...new Set(a.map(r=>pick(r,['Tahun','TAHUN'])||((pick(r,['Tarikh Pelaksanaan','Tarikh Sasaran Pelaksanaan']).match(/\b20\d{2}\b/)||[])[0]||'')).filter(Boolean))].sort();$('#st').innerHTML='<option value="">Semua Negeri</option>'+states.map(x=>`<option>${esc(x)}</option>`).join('');$('#yr').innerHTML='<option value="">Semua Tahun</option>'+years.map(x=>`<option>${esc(x)}</option>`).join('');$('#prog').textContent=P.length.toLocaleString();$('#inst').textContent=I.length.toLocaleString();$('#total').textContent=(P.length+I.length).toLocaleString()}
function rows(){const m=$('#ds').value,q=$('#q').value.toLowerCase(),st=$('#st').value,yr=$('#yr').value;let a=m==='program'?P.map(r=>({...r,__d:'Program'})):m==='institusi'?I.map(r=>({...r,__d:'Institusi Pendidikan'})):P.map(r=>({...r,__d:'Program'})).concat(I.map(r=>({...r,__d:'Institusi Pendidikan'})));return a.filter(r=>{const state=pick(r,['Negeri','NEGERI']),year=pick(r,['Tahun','TAHUN'])||((pick(r,['Tarikh Pelaksanaan','Tarikh Sasaran Pelaksanaan']).match(/\b20\d{2}\b/)||[])[0]||'');return(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!st||state===st)&&(!yr||year===yr)})}
function cols(a){const set=new Set(['Dataset']);a.forEach(r=>Object.keys(r).forEach(k=>{if(k!=='__d')set.add(k)}));return [...set]}
function render(){const a=rows(),max=Math.max(1,Math.ceil(a.length/size));pg=Math.min(pg,max);const c=cols(a),v=a.slice((pg-1)*size,pg*size);$('#note').textContent=`${a.length.toLocaleString()} rekod ditemui · Halaman ${pg}/${max}`;$('#head').innerHTML='<tr>'+c.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';$('#body').innerHTML=v.length?v.map(r=>'<tr>'+c.map(x=>`<td>${esc(x==='Dataset'?r.__d:(r[x]??'—'))}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${c.length}" style="padding:30px;text-align:center">Tiada data</td></tr>`;$('#pageinfo').textContent=`${a.length?((pg-1)*size+1):0}–${Math.min(pg*size,a.length)} daripada ${a.length.toLocaleString()}`;$('#prev').disabled=pg===1;$('#next').disabled=pg===max;const o={};a.forEach(r=>{const x=pick(r,['Negeri','NEGERI'])||'Tidak Dinyatakan';o[x]=(o[x]||0)+1});const it=Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,8),mx=Math.max(...it.map(x=>x[1]),1);$('#bars').innerHTML=it.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join('')}
function csv(){try{const a=rows(),c=cols(a),cell=v=>'"'+String(v??'').replace(/\r?\n/g,' ').replace(/"/g,'""')+'"',lines=[c.map(cell).join(',')];a.forEach(r=>lines.push(c.map(x=>cell(x==='Dataset'?r.__d:(r[x]??''))).join(',')));const b=new Blob(["\uFEFF"+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='SMART-KDAT-Data.csv';document.body.appendChild(x);x.click();setTimeout(()=>{URL.revokeObjectURL(u);x.remove()},1000)}catch(e){alert(e.message)}}
function pdf(){try{const a=rows(),w=window.open('','_blank');if(!w)throw Error('Popup disekat browser.');const clean=esc,rowsHtml=a.slice(0,150).map((r,i)=>`<tr><td>${i+1}</td><td>${clean(pick(r,['Nama Program','Nama Institusi'])||'—')}</td><td>${clean(pick(r,['Negeri'])||'—')}</td></tr>`).join('');w.document.write(`<!doctype html><html><head><title>SMART KDAT PDF</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#0B2545;color:#fff}@media print{button{display:none}}</style></head><body><h1>SMART KDAT — Data Explorer</h1><p>Jumlah rekod: ${a.length.toLocaleString()}</p><button onclick="window.print()">Print / Save as PDF</button><table><tr><th>#</th><th>Nama</th><th>Negeri</th></tr>${rowsHtml}</table></body></html>`);w.document.close()}catch(e){alert('PDF tidak dapat dijana: '+e.message)}}
['q','ds','st','yr'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{pg=1;render()}));$('#reset').onclick=()=>{$('#q').value='';$('#ds').value='all';$('#st').value='';$('#yr').value='';pg=1;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('active',b.dataset.m==='all'));render()};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{$('#ds').value=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x===b));pg=1;render()});$('#prev').onclick=()=>{pg--;render()};$('#next').onclick=()=>{pg++;render()};$('#csv').onclick=csv;$('#pdf').onclick=pdf;
</script></body></html>
